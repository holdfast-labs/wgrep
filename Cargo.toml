[package]
name = "wgrep"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "wg: semantic code search and ripgrep-compatible text search through one local daemon."
repository = "https://github.com/holdfast-labs/wgrep"

# The upstream sgrep CLI stays available under its original name for parity
# checks. Release archives ship only `wg`.
[[bin]]
name = "sgrep"
path = "src/main.rs"

[workspace]

[dependencies]
memmap2 = "0.9"
crc32fast = "1"
sha2 = "0.11"
tempfile = "3"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
half = "2"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
regex = "1"
rayon = "1"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
tree-sitter-language-pack = "=1.21.0"
tree-sitter = "=0.27.1"
memchr = "2"
chonkie = { version = "=0.1.1", default-features = false }
notify = "8.2"

[patch.crates-io]
notify = { path = "vendor/notify" }

[profile.release]
lto = "thin"
