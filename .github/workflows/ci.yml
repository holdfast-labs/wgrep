name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run library and binary tests
        run: cargo test --locked --lib --bins

      - name: Build release wg
        run: cargo build --locked --release --bin wg

      - name: Packaging self-test
        run: ${{ matrix.python }} scripts/wg_release.py self-test --work "${{ runner.temp }}/wg-self-test"
