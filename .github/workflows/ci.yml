name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # wg does not need `rg`: ripgrep 15.1.0 is built in. The parity tests
      # compare wg against a real, SHA-256-pinned rg 15.1.0 binary.
      - name: Install ripgrep 15.1.0 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          RG_ASSET: ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz
          RG_SHA256: 1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output "${RUNNER_TEMP}/${RG_ASSET}" \
            "https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/${RG_ASSET}"
          echo "${RG_SHA256}  ${RUNNER_TEMP}/${RG_ASSET}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/rg"
          tar --extract --gzip --file "${RUNNER_TEMP}/${RG_ASSET}" \
            --directory "${RUNNER_TEMP}/rg" --strip-components=1
          echo "${RUNNER_TEMP}/rg" >> "${GITHUB_PATH}"

      - name: Install ripgrep 15.1.0 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RG_ASSET: ripgrep-15.1.0-x86_64-pc-windows-msvc.zip
          RG_SHA256: 124510b94b6baa3380d051fdf4650eaa80a302c876d611e9dba0b2e18d87493a
        run: |
          $ErrorActionPreference = "Stop"
          $file = Join-Path $env:RUNNER_TEMP $env:RG_ASSET
          Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/$env:RG_ASSET" -OutFile $file -UseBasicParsing
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
          if ($actual -ne $env:RG_SHA256) { throw "ripgrep SHA-256 mismatch: got $actual" }
          Expand-Archive -LiteralPath $file -DestinationPath "$env:RUNNER_TEMP\rg-unpack" -Force
          $dir = (Get-ChildItem "$env:RUNNER_TEMP\rg-unpack" -Directory | Select-Object -First 1).FullName
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Check ripgrep
        run: rg --version

      - name: Run library and binary tests
        run: cargo test --locked --lib --bins

      - name: Run parity tests against rg 15.1.0
        run: cargo test --locked --test wg_lexical_parity --test wg_source_files_parity

      - name: Run wisp-grep tests
        working-directory: crates/wisp-grep
        run: cargo test --locked

      - name: Build release wg
        run: cargo build --locked --release --bin wg

      - name: Packaging self-test
        run: ${{ matrix.python }} scripts/wg_release.py self-test --work "${{ runner.temp }}/wg-self-test"

  # Informational only. macOS is not qualified yet, so this job may fail and
  # must not make CI red. Remove continue-on-error after the first green run.
  macos:
    name: test (macos-14, informational)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install ripgrep 15.1.0 (macOS arm64)
        shell: bash
        env:
          RG_ASSET: ripgrep-15.1.0-aarch64-apple-darwin.tar.gz
          RG_SHA256: 378e973289176ca0c6054054ee7f631a065874a352bf43f0fa60ef079b6ba715
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output "${RUNNER_TEMP}/${RG_ASSET}" \
            "https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/${RG_ASSET}"
          actual=$(shasum -a 256 "${RUNNER_TEMP}/${RG_ASSET}" | awk '{print $1}')
          if [ "${actual}" != "${RG_SHA256}" ]; then
            echo "ripgrep SHA-256 mismatch: expected ${RG_SHA256}, got ${actual}" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/rg"
          tar --extract --gzip --file "${RUNNER_TEMP}/${RG_ASSET}" \
            --directory "${RUNNER_TEMP}/rg" --strip-components=1
          echo "${RUNNER_TEMP}/rg" >> "${GITHUB_PATH}"

      - name: Check ripgrep
        run: rg --version

      - name: Run library and binary tests
        run: cargo test --locked --lib --bins

      - name: Run parity tests against rg 15.1.0
        if: ${{ !cancelled() }}
        run: cargo test --locked --test wg_lexical_parity --test wg_source_files_parity

      - name: Run wisp-grep tests
        if: ${{ !cancelled() }}
        working-directory: crates/wisp-grep
        run: cargo test --locked

      - name: Build release wg
        if: ${{ !cancelled() }}
        run: cargo build --locked --release --bin wg

      - name: Packaging self-test
        if: ${{ !cancelled() }}
        run: python3 scripts/wg_release.py self-test --work "${{ runner.temp }}/wg-self-test"
