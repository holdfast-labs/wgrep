name: Feature request
description: Suggest a change or a new capability for wg.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Check the [README](https://github.com/holdfast-labs/wgrep/blob/main/README.md)
        and existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, flags, or workarounds you tried.
  - type: input
    id: use_case
    attributes:
      label: Use case
      description: One short example of the workflow this would improve.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this request.
          required: true
        - label: This is not a security report.
          required: true
